name: Windows-Hülle

# BookLedgerPro für Windows (Pro-Umbau 5, Klaus 2026-10-28): Tauri 2 / WebView2 + Java-Engine mit dem byte-gleichen
# Tresor-Paket. Baut einen Prüfbau (mit Prüf-Schnittstelle) und prüft ihn installiert, dann den Auslieferungsbau ohne
# Prüf-Schnittstelle. Unsigniert, KEINE Veröffentlichung — die kommt erst auf Klaus' Wort.
# Sparsam (Klaus 2026-10-29): Windows-Minuten zählen im privaten Repo doppelt. Nur wenn sich Windows-Teile ändern
# (PR und main); vor einer Windows-Veröffentlichung von Hand starten (workflow_dispatch).
on:
  pull_request:
    paths: ['windows/**', 'android/app/src/main/java/de/familyprojekt/tresor/**', '.github/workflows/windows.yml']
  push:
    branches: ['main']
    paths: ['windows/**', 'android/app/src/main/java/de/familyprojekt/tresor/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Engine mit gestellter Hülle (Tresor, Speichern, Eingang)
        run: node windows/engine/test.mjs
      - name: Echter Kindprozess über stdio
        run: node windows/engine/protocol-test.mjs
      - name: Scanner-Baustein byte-gleich (Quelle Workflow PDF Pro) und im Browser geprüft
        run: |
          npm ci --ignore-scripts --prefix windows
          npx --prefix windows playwright-core install chromium
          node tools/native/scanner-nachziehen.mjs
          NODE_PATH=windows/node_modules node tools/native/test-pro-scanner.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Quellen ohne Zeilenumwandlung auschecken (Pins des Tresor-Pakets sind Bytes)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --prefix windows
      - name: Rust-Abhängigkeiten
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target
          cache-on-failure: true
      - name: Engine auf dem Windows-Dateisystem
        run: node windows/engine/test.mjs
      - name: Eigene Java-Laufzeit (jlink) und Symbol
        run: node windows/tools/prepare-runtime.mjs
      - name: Scanner-Skript (WIA) auf echtem Windows
        run: node windows/scanner/test-wia.mjs
      - name: Kindprozess mit der gebündelten Laufzeit
        run: node windows/engine/protocol-test.mjs windows/runtime/jre/bin/java.exe windows/runtime
      - name: Prüfbau (mit Prüf-Schnittstelle)
        run: npm run tauri --prefix windows -- build --bundles nsis --features messprobe
      - name: Installiert prüfen, zweimal starten, deinstallieren
        timeout-minutes: 20
        run: ./windows/pruefung/installed.ps1
        env:
          BLP_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-abnahme
          path: windows/pruef-out/
          if-no-files-found: ignore
          retention-days: 14
      - name: Auslieferungsbau ohne Prüf-Schnittstelle
        run: npm run tauri --prefix windows -- build --bundles nsis
      - name: Auslieferungsbau installieren, starten, entfernen
        run: ./windows/pruefung/production.ps1
      - name: Installer mit Prüfsumme bereitlegen
        run: node windows/tools/distribution.mjs
        env:
          BLP_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigniert
          path: windows/distribution/
          if-no-files-found: error
          retention-days: 30
