name: BookLedgerPro Android veröffentlichen

# Signierte Android-APK auf Klaus' Wort (2026-10-27: „veröffentliche die Test-APKs für Android“). Vorbild:
# Workflow PDF Pro workflow-pdf-release.yml. Nur von main, nur ein zuvor geprüfter Commit (Check „android“ grün),
# Signatur mit der dauerhaften Identität (signing/, Zertifikat 7a6217eb…) über BLP_SIGNING_UNLOCK der Umgebung
# android-production, echte Erstinstallation mit Datenerhalt im Emulator, Download danach bytegleich geprüft.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Regulärer Tag, z. B. v0.1.0 (muss zu versionName passen)
        required: true
        type: string
      commit:
        description: Vollständiger zuvor geprüfter main-Commit
        required: true
        type: string
      entwurf_freigeben:
        description: Nur einen vorhandenen, schon geprüften Entwurf dieses Tags freigeben (kein neuer Bau)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  checks: read
concurrency:
  group: bookledgerpro-android-release
  cancel-in-progress: false
jobs:
  entwurf:
    if: github.ref == 'refs/heads/main' && inputs.entwurf_freigeben
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Entwurf prüfen und freigeben
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'lausiklauskn-png/BookLedgerPro' ]]
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          node tools/signing/publish-release.mjs "$RELEASE_TAG" "$EXPECTED_COMMIT" --entwurf
  build:
    if: github.ref == 'refs/heads/main' && !inputs.entwurf_freigeben
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Geprüften Stand verlangen
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'lausiklauskn-png/BookLedgerPro' ]]
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ && "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          for file in package-lock.json android/gradlew signing/android-release.enc.json signing/android-certificate.json; do
            test -f "$file" || { echo "Fehlt: $file"; exit 1; }
          done
          grep -q "versionName \"${RELEASE_TAG#v}\"" android/app/build.gradle || { echo 'versionName passt nicht zum Tag'; exit 1; }
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --paginate \
            --jq '[.check_runs[] | select(.name == "android" and .conclusion == "success")] | length' | awk '{n+=$1} END {print n}')
          test "$passed" -ge 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Proben
        run: |
          set -euo pipefail
          npm ci
          node tests/run.mjs
          node tools/native/test-native.mjs
          node --test tools/signing/test-identity.mjs tools/signing/test-unlock-file.mjs tools/signing/test-release-policy.mjs
          npm run sync:android
      - name: Unsignierte Release-APK bauen
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleRelease lintRelease testReleaseUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-release-apk
          path: unsigned-apk
      - name: Android-Signierwerkzeuge
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0'
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Mit der dauerhaften Identität signieren und prüfen
        env:
          BLP_SIGNING_UNLOCK: ${{ secrets.BLP_SIGNING_UNLOCK }}
          BLP_RELEASE_TAG: ${{ inputs.tag }}
          BLP_RELEASE_COMMIT: ${{ github.sha }}
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          export BLP_APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          export BLP_AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          mkdir release-files
          node tools/signing/cli.mjs sign-apk unsigned-apk/app-release-unsigned.apk \
            "release-files/BookLedgerPro-${BLP_RELEASE_TAG#v}.apk"
      - name: KVM für den Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Signierte APK installieren, Tresor anlegen, überinstallieren, Tresor noch da
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 tools/native/verify-signed-install.py "release-files/BookLedgerPro-${RELEASE_TAG#v}.apk"
      - name: Nachweise bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-probe-failure
          path: |
            release-files/*.json
            release-files/probe-*
          if-no-files-found: ignore
      - name: Veröffentlichen und Download prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/signing/publish-release.mjs "$RELEASE_TAG" "$GITHUB_SHA" release-files
