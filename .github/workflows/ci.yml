name: CI

# Sparsam (Klaus 2026-10-29: Freiminuten des privaten Repos aufgebraucht): nicht doppelt bei Push UND PR — Push nur auf main,
# sonst über den PR; ein neuer Stand bricht den alten Lauf ab.
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Logik-Smoke-Test (Krypto + Shamir)
        run: node tests/run.mjs
