name: Android-Hülle

# Baut die native Android-App aus dem unveränderten Web-Stand (Schritt A, Klaus 2026-10-26).
# Nur ein Prüf-Bau (debug): keine Signatur, keine Veröffentlichung — die kommt erst auf Klaus' Wort.
# Sparsam (Klaus 2026-10-29): auf main immer (android-release.yml verlangt einen grünen „android“-Lauf auf dem main-Commit),
# im PR nur, wenn sich Android-Teile ändern; sonst von Hand (workflow_dispatch). Die Web-Teile prüft ci.yml.
on:
  push:
    branches: ['main']
  pull_request:
    paths: ['android/**', 'native/**', 'tools/native/**', 'capacitor.config.json', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Web-Paket und Hülle prüfen (ohne Android)
        run: node tools/native/test-native.mjs
      - name: Signier-Werkzeuge mit Wegwerf-Schlüssel prüfen (kein echter Schlüssel)
        run: node --test tools/signing/test-identity.mjs tools/signing/test-unlock-file.mjs tools/signing/test-release-policy.mjs
      - name: APK-Signatur mit echtem apksigner an künstlicher APK prüfen (Wegwerf-Schlüssel)
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0' 'platforms;android-36' > /dev/null
          BLP_ANDROID_SDK="$ANDROID_HOME" node --test tools/signing/test-apk.mjs
      - name: Web-Paket bauen und in die Hülle legen
        run: npm run sync:android
      - name: Bauen, Lint und JVM-Proben
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookledgerpro-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
