  <!-- Deckblatt-Bild vorbestellen (2026-08-03). Das Bild ist das LCP-Element,
       aber es steht NICHT im HTML — src/ui/intro.js baut es erst, nachdem alle
       Module geladen und ausgefuehrt sind. Der Browser erfaehrt sonst erst ganz
       am Ende davon und faengt dann erst an zu laden. Gemessen: LCP 20,1 s.
       Der Vorabruf kostet 113 KiB auch bei den Nutzern, die das Deckblatt
       abgeschaltet haben ("nicht mehr automatisch anzeigen") — vertretbar,
       weil der Service-Worker das Bild ohnehin vorhaelt. -->
  <link rel="preload" as="image" href="./assets/img/cover.webp" fetchpriority="high" />
  <!-- Start-Modulbaum vorbestellen (2026-08-03). Ohne diese Zeilen findet der
       Browser die Module erst eine Ebene nach der anderen: index.html erfaehrt
       von main.js, main.js von intro.js, intro.js von mycel.js, mycel.js von
       wappen.js — fuenf Wartezeiten hintereinander, bevor das Deckblatt steht.
       Mit modulepreload holt er alle neun sofort und gleichzeitig.
       Es sind genau die neun Dateien des statischen Startbaums (nachgezaehlt,
       nicht geraten). Alles, was erst nach dem Entsperren gebraucht wird, kommt
       weiterhin per dynamischem import() und steht bewusst NICHT hier.
       Build-frei: modulepreload ist ein HTML-Tag, kein Bundler. -->
  <link rel="modulepreload" href="./src/main.js" />

  <script type="module" src="./src/main.js"></script>

  <!-- SBKIM Andock-Runtime + Auto-Lauschen (Stufe 2, 2026-06-27) — additiv.
       Acht Module byte-identisch aus Sage src/modules/ kopiert (Modul-09-Regel:
       kopieren, nicht modifizieren). 05b als type=module (importiert noble relativ).
       sbkim-init.js startet nach Anastomose.init() fail-soft listenNostr() —
       Empfangsmodus mit Antwortrecht. Betrifft NUR die SBKIM-Identität, nie
       Buchhaltungsdaten. -->
  <!-- Identitäts-Isolierung (2026-07-11): globaler SBKIM-Default-DB-Suffix, GANZ
       FRÜH gesetzt (klassisches inline <script> läuft synchron VOR den folgenden
       Modul-Skripten). Modul 01 nimmt daraus den Default-DB-Namen
       `sbkim_bookledgerpro-sbkim` — so landet JEDER Storage-Zugriff in der eigenen
       Schublade der SBKIM-Identität (getrennt von Geschwister-Apps auf dem
       geteilten github.io-Origin), unabhängig von der init-Reihenfolge. Wert =
       exakt der SBKIM-Storage-Identitäts-Suffix aus sbkim-init.js. -->
  <script>window.SBKIM_DB_SUFFIX="bookledgerpro-sbkim";</script>
  <!-- ── SBKIM-Stapel: NACHLADEN statt im kritischen Pfad (Klaus 2026-08-03) ──
       Die 16 Dateien sind zusammen ~260 KiB und standen als klassische
       <script src>-Tags im Rumpf. Klassische Skripte blockieren den Parser:
       sie mussten also komplett geladen UND ausgefuehrt sein, bevor das
       Modul ./src/main.js an die Reihe kam — und erst main.js baut das
       Deckblatt mit dem LCP-Bild. Gemessen an Klaus' Server: 11.270 ms
       Blockierung, LCP 20,1 s.

       Jetzt haengt der Stapel am load-Ereignis: die Seite ist da, DANN kommt
       das Mycel. Die Reihenfolge bleibt exakt erhalten (script.async=false
       garantiert bei dynamisch eingehaengten Skripten die Ausfuehrung in
       Einhaenge-Reihenfolge). Nachgeprueft vor dem Umbau: der App-Code in
       src/ greift beim Start auf KEINE der window.Sbkim*-Globals zu — die
       einzige Fundstelle war ein Kommentar. Die Lampen-Leiste und der
       🌐-Knopf erscheinen dadurch einen Wimpernschlag spaeter; alles ist
       fail-soft, es geht nichts verloren.

       ⚠ Die Dateien unter sbkim/ selbst sind byte-gleiche Kopien aus dem
       Sage-Kanon und wurden NICHT angefasst — nur der Zeitpunkt, zu dem sie
       geholt werden, hat sich geaendert. -->
  <script>
  (function () {
    var stapel = [
      './sbkim/01_storage.js', 'sbkim/20_schluessel_safe.js', './sbkim/02_spore.js',
      './sbkim/03_embedding.js', './sbkim/04_match.js', './sbkim/05_anastomose.js',
      './sbkim/07_apoptose.js', './sbkim/15_membran.js', './sbkim/16_siegel.js',
      './sbkim/17_floating_widget.js', ['./sbkim/05b_nostr_relay.js', 'module'],
      './sbkim/21_spracheingabe.js', './sbkim/23_rendezvous.js',
      './sbkim/23_rendezvous_ui.js', './sbkim/siegel-inhalt.js', './sbkim/sbkim-init.js'
    ];
    function laden() {
      for (var i = 0; i < stapel.length; i++) {
        var e = stapel[i], pfad = Array.isArray(e) ? e[0] : e;
        var s = document.createElement('script');
        if (Array.isArray(e)) s.type = e[1];
        s.src = pfad;
        s.async = false;           // haelt die Reihenfolge ein
        document.body.appendChild(s);
      }
    }
    if (document.readyState === 'complete') laden();
    else window.addEventListener('load', laden);
  })();
  </script>
  <!-- Was in der Liste oben steht, in der Reihenfolge der Liste:
       01 Storage · 20 Schlüssel-Safe · 02 Spore · 03 Embedding · 04 Match ·
       05 Anastomose · 07 Apoptose · 15 Membran (Außenhülle / Fremdzugriff-Lampe) ·
       16 SBKIM-Siegel (Selbst-Bezeugung, rendert nur bei wirklich vorhandenen
       Pflicht-Modulen — Anti-Greenwashing) · 17 Floating-Widget (Lampen
       LEBT/VERKEHR/FREMD/SIEGEL) · 05b Nostr-Relais (als Modul, importiert noble
       relativ) · 21 Spracheingabe (🎤, VOR 23, damit das Rendezvous-UI sie
       nutzen kann) · 23 Rendezvous + dessen UI (🌐-Knopf) · siegel-inhalt.js
       (das Andock-Werkzeug IM Siegel — Modul 16 rendert nur das Gerüst; NUR das
       WIZ-Objekt darin ist BLP-eigen) · sbkim-init.js (mountet und startet
       fail-soft listenNostr — Empfangsmodus mit Antwortrecht).
       Betrifft NUR die SBKIM-Identität, nie Buchhaltungsdaten. -->
