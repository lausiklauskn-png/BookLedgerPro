<body>
  <noscript>BookLedgerPro benötigt JavaScript (läuft vollständig lokal in Ihrem Browser).</noscript>

  <div id="app-root">
    <div class="lock-screen">
      <div class="lock-card"><p class="muted">Lädt …</p></div>
    </div>
  </div>

  <!-- Build-frei: native ES-Module, keine CDNs (offline-first). -->
  <script type="module" src="./src/main.js"></script>

  <!-- SBKIM Andock-Runtime + Auto-Lauschen (Stufe 2, 2026-06-27) — additiv.
       Acht Module byte-identisch aus Sage src/modules/ kopiert (Modul-09-Regel:
       kopieren, nicht modifizieren). 05b als type=module (importiert noble relativ).
       sbkim-init.js startet nach Anastomose.init() fail-soft listenNostr() —
       Empfangsmodus mit Antwortrecht. Betrifft NUR die SBKIM-Identität, nie
       Buchhaltungsdaten. -->
  <!-- Identitäts-Isolierung (2026-07-11): globaler SBKIM-Default-DB-Suffix, GANZ
       FRÜH gesetzt (klassisches inline <script> läuft synchron VOR den folgenden
       Modul-Skripten). Modul 01 nimmt daraus den Default-DB-Namen
       `sbkim_bookledgerpro-sbkim` — so landet JEDER Storage-Zugriff in der eigenen
       Schublade der SBKIM-Identität (getrennt von Geschwister-Apps auf dem
       geteilten github.io-Origin), unabhängig von der init-Reihenfolge. Wert =
       exakt der SBKIM-Storage-Identitäts-Suffix aus sbkim-init.js. -->
  <script>window.SBKIM_DB_SUFFIX="bookledgerpro-sbkim";</script>
  <script src="./sbkim/01_storage.js"></script>
  <script src="sbkim/20_schluessel_safe.js"></script>
  <script src="./sbkim/02_spore.js"></script>
  <script src="./sbkim/03_embedding.js"></script>
  <script src="./sbkim/04_match.js"></script>
  <script src="./sbkim/05_anastomose.js"></script>
  <script src="./sbkim/07_apoptose.js"></script>
  <!-- Modul 15 Membran (Außenhülle / Fremdzugriff-Lampe) + Modul 16 SBKIM-Siegel
       (Selbst-Bezeugung). Byte-identisch aus Sage src/modules/ kopiert. BLP
       erwirbt damit ein echtes, zertifiziertes Siegel im Widget (Anti-Green-
       washing: das Siegel rendert nur, wenn die Pflicht-Module wirklich da sind).
       Betrifft NUR die SBKIM-Identität, nie Buchhaltungsdaten. -->
  <script src="./sbkim/15_membran.js"></script>
  <script src="./sbkim/16_siegel.js"></script>
  <!-- Modul 17 Floating-Widget (Lampen-Design): LEBT/VERKEHR/FREMD/SIEGEL. -->
  <script src="./sbkim/17_floating_widget.js"></script>
  <script type="module" src="./sbkim/05b_nostr_relay.js"></script>
  <!-- Modul 21 Spracheingabe (🎤 Netz-Panel). Byte-1:1 aus Sage src/modules/.
       Vor Modul 23, damit das Rendezvous-UI die Sprach-Erkennung nutzen kann. -->
  <script src="./sbkim/21_spracheingabe.js"></script>
  <!-- Modul 23 Rendezvous (gemeinsamer Raum) + öffentlicher 🌐-Knopf. Byte-1:1
       aus Sage src/modules/23_rendezvous(.ui).js. Vor sbkim-init.js (das mountet). -->
  <script src="./sbkim/23_rendezvous.js"></script>
  <script src="./sbkim/23_rendezvous_ui.js"></script>
  <!-- Siegel-Modal-INHALT (das Andock-Werkzeug im Siegel). Modul 16 rendert nur
       das Gerüst; den Inhalt injiziert die App host-seitig, sobald das Modal im
       DOM hängt. Aus dem Sage-Kanon assets/siegel-inhalt.js kopiert — NUR das
       WIZ-Objekt ist BLP-eigen. Fünf Bausteine: Identität erzeugen · Spore
       signieren+⬇ · verschlüsseltes Backup · Wiederherstellen · Identitäts-
       Wechsler. Betrifft NUR die SBKIM-Identität, nie Buchhaltungsdaten. -->
  <script src="./sbkim/siegel-inhalt.js"></script>
  <script src="./sbkim/sbkim-init.js"></script>
